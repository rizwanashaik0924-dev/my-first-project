<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌤 Weather Dashboard</h1>

        <p class="subtitle">
            Check current weather anywhere in the world
        </p>

        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
                autocomplete="off"
            >

            <button id="searchBtn">
                Search
            </button>

        </div>

        <p id="message"></p>

        <div class="weather-card">

            <div class="location">

                <span>📍</span>

                <h2 id="cityName">
                    Vijayawada
                </h2>

            </div>

            <p id="dateTime">
                --
            </p>

            <div class="weather-main">

                <img
                    id="weatherIcon"
                    src="https://openweathermap.org/img/wn/04d@2x.png"
                    alt="Weather Icon"
                >

                <div>

                    <div
                        id="temperature"
                        class="temperature"
                    >
                        --°C
                    </div>

                    <div
                        id="description"
                        class="description"
                    >
                        --
                    </div>

                </div>

            </div>

            <div class="weather-info">

                <div class="info-box">

                    <div class="info-icon">
                        💧
                    </div>

                    <p>Humidity</p>

                    <strong id="humidity">
                        --%
                    </strong>

                </div>


                <div class="info-box">

                    <div class="info-icon">
                        🌡️
                    </div>

                    <p>Temperature</p>

                    <strong id="temperatureDetail">
                        --°C
                    </strong>

                </div>


                <div class="info-box">

                    <div class="info-icon">
                        🌍
                    </div>

                    <p>Location</p>

                    <strong id="country">
                        --
                    </strong>

                </div>

            </div>

        </div>

        <p class="footer">
            Weather data powered by OpenWeather
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
